version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-finance-api
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: